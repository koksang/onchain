  #   max_msg_bytes: 1000000
  #   timeout: 5s
  #   retry_as_batch: false
  #   batching:
  #     count: 0
  #     byte_size: 0
  #     period: ""
  #     check: ""
  #     processors: [] # No default (optional)
  #   max_retries: 0
  #   backoff:
  #     initial_interval: 3s
  #     max_interval: 10s
  #     max_elapsed_time: 30s
input_resources: []
processor_resources: []
output_resources: []
cache_resources: []
rate_limit_resources:
  - label: api_limit
    local:
      count: 1
      interval: 10s
logger:
  level: INFO
  format: logfmt
  add_timestamp: false
  level_name: level
  timestamp_name: time
  message_name: msg
  static_fields:
    '@service': benthos
  file:
    path: ""
    rotate: false
    rotate_max_age_days: 0
metrics:
  prometheus: {}
  mapping: ""
tracer:
  none: {}
shutdown_delay: 0s
shutdown_timeout: 20s
tests: []

