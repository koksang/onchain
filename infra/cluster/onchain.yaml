apiVersion: v1
kind: Namespace
metadata:
  name: onchain
---
# ----------------------------------- storage -----------------------------------
kind: StorageClass
apiVersion: storage.k8s.io/v1
metadata:
  name: local
provisioner: microk8s.io/hostpath
reclaimPolicy: Retain
parameters:
  pvDir: /data
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: local-pv
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 1Gi
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    name: local-pvc
  hostPath:
    path: /data/local
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - microk8s-vm
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: local-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: redis-pv
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 5Gi
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    name: redis-pvc
    
  hostPath:
    path: /data/redis
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - microk8s-vm
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: ch-pv
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 30Gi
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    name: ch-pvc
    
  hostPath:
    path: /data/clickhouse
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - microk8s-vm
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ch-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 30Gi
---
# ----------------------------------- redis -----------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7.2.5-alpine
        resources:
          limits:
            cpu: "200m"
            memory: "320Mi"
        ports:
        - containerPort: 6379
        volumeMounts:
          - mountPath: /data
            name: redis-data
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: redis-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: redis
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: http
---
apiVersion: v1
kind: Service
metadata:
  name: redis-external
spec:
  selector:
    app: redis
  type: NodePort
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      nodePort: 30379
      name: http-external
---
# ----------------------------------- clickhouse -----------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-configmap
data:
  config.onchain.yaml: |
    listen_host: 0.0.0.0
    prometheus:
      endpoint: /metrics
      port: 9363
      metrics: true
      events: true
      asynchronous_metrics: true
  users_config.profiles.yaml: |
    profiles:
      admin:
        max_memory_usage: 5000000000
        load_balancing: random
  users_config.quotas.yaml: |
    quotas:
      admin:
        interval:
          duration: 3600
          queries: 0
          errors: 0
          results_rows: 0
          read_rows: 0
          execution_time: 0
  users_config.roles.yaml: |
    roles:
      admin:
        grants:
          - query: "GRANT SHOW ON *.*"
          - query: "REVOKE SHOW ON system.*"
          - query: "GRANT CREATE ON *.* WITH GRANT OPTION"
  user.onchain.yaml: |
    users:
      onchain:
        password: onchain
        networks:
          ip: "::/0"
        profile: admin
        quota: admin
        access_management: 1
        named_collection_control: 1
        show_named_collections: 1
        show_named_collections_secrets: 1
        double_sha1_passwords: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clickhouse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        app: clickhouse
    spec:
      volumes:
        - name: clickhouse-configmap
          configMap:
            name: clickhouse-configmap
        - name: clickhouse-storage
          persistentVolumeClaim:
            claimName: ch-pvc
      containers:
      - name: clickhouse
        image: clickhouse/clickhouse-server:24.1.6.52-alpine
        # command: ["sleep","infinity"]
        ports:
        - containerPort: 8123
        - containerPort: 8443
        - containerPort: 9000
        - containerPort: 9363
        resources:
          limits:
            cpu: 1
            memory: 4Gi
          requests:
            cpu: 1
            memory: 4Gi
        volumeMounts:
            - name: clickhouse-storage
              mountPath: /var/lib/clickhouse
            - name: clickhouse-configmap
              mountPath: /etc/clickhouse-server/config.d/config.onchain.yaml
              subPath: config.onchain.yaml
            - name: clickhouse-configmap
              mountPath: /etc/clickhouse-server/users.d/users_config.profiles.yaml
              subPath: users_config.profiles.yaml
            - name: clickhouse-configmap
              mountPath: /etc/clickhouse-server/users.d/users_config.quotas.yaml
              subPath: users_config.quotas.yaml
            - name: clickhouse-configmap
              mountPath: /etc/clickhouse-server/users.d/users_config.roles.yaml
              subPath: users_config.roles.yaml
            - name: clickhouse-configmap
              mountPath: /etc/clickhouse-server/users.d/user.onchain.yaml
              subPath: user.onchain.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
spec:
  selector:
    app: clickhouse
  type: ClusterIP
  ports:
    - port: 9000
      targetPort: 9000
      protocol: TCP
      name: http
    - port: 8123
      targetPort: 8123
      protocol: TCP
      name: http-non-tls
    - port: 8443
      targetPort: 8443
      protocol: TCP
      name: https-tls
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse-external
spec:
  selector:
    app: clickhouse
  type: NodePort
  ports:
    - port: 9000
      targetPort: 9000
      protocol: TCP
      nodePort: 30900
      name: http-external
    - port: 8443
      targetPort: 8443
      protocol: TCP
      nodePort: 30943
      name: http-tls-external