apiVersion: jetstream.nats.io/v1beta2
kind: Stream
metadata:
  name: blockchain
spec:
  name: blockchain
  subjects:
    - blockchain.evm.block_number
  storage: file
  maxAge: 1h
  replicas: 1

---
apiVersion: jetstream.nats.io/v1beta2
kind: Consumer
metadata:
  name: blockchain
spec:
  streamName: blockchain
  durableName: blockchain
  deliverPolicy: new
  filterSubject: blockchain.*
  maxDeliver: 10
  ackPolicy: explicit
  maxAckPending: 10

